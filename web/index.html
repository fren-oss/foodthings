  <style>
    /* Splash tetap memakai CSS mandiri agar tampil sebelum Tailwind dimuat. */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(32px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      overflow: hidden;
      background:
        radial-gradient(ellipse at 12% 26%, rgba(255, 255, 255, 0.2), transparent 30%),
        radial-gradient(ellipse at 88% 72%, rgba(255, 225, 142, 0.2), transparent 32%),
        radial-gradient(ellipse at 50% 48%, rgba(219, 250, 155, 0.38), transparent 42%),
        #7CC73B;
      color: #12210A;
      opacity: 1;
      transition: opacity 0.3s ease;
      -webkit-user-select: none;
      user-select: none;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #splash > * {
      position: relative;
      z-index: 1;
    }

    /* ── Atas: brand ─────────────────────────────────────────── */
    #splash .splash-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transform: translateY(42px);
    }

    #splash .splash-glyph {
      width: 50px;
      height: 50px;
    }

    #splash .splash-glyph svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    #splash .splash-wordmark {
      margin: 10px 0 0;
      font-size: 28px;
      line-height: 34px;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: center;
    }

    #splash .splash-tagline {
      margin: 4px 0 0;
      font-size: 13px;
      line-height: 20px;
      font-weight: 500;
      opacity: 0.7;
      text-align: center;
    }

    /* ── Tengah: info singkat dan Limo ─────────────────────── */
    #splash .splash-hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex: 1;
      min-height: 0;
      width: 100%;
      margin: 12px 0;
    }

    #splash .splash-hero::after {
      position: absolute;
      top: 47%;
      right: 12%;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #FFE08A;
      box-shadow: -246px 74px 0 -3px rgba(255, 255, 255, 0.9),
        -275px -70px 0 -4px rgba(18, 33, 10, 0.55);
      content: "";
      animation: splashTwinkle 2.8s ease-in-out infinite;
      pointer-events: none;
    }

    #splash .splash-chips {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
    }

    #splash .splash-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(18, 33, 10, 0.08);
      border-radius: 9999px;
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.92);
      color: #12210A;
      font-size: 11px;
      line-height: 16px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(18, 33, 10, 0.08);
      animation: splashChipFloat 3.2s ease-in-out infinite;
    }

    #splash .splash-chip:nth-child(2) {
      border-color: rgba(164, 95, 0, 0.16);
      background: rgba(255, 244, 204, 0.96);
      animation-delay: -1.6s;
    }

    #splash .splash-chip:nth-child(2) svg {
      color: #A45F00;
    }

    #splash .splash-chip svg {
      display: block;
      width: 14px;
      height: 14px;
      color: #426900;
    }

    #splash .splash-mascot {
      position: relative;
      flex: 0 0 auto;
      height: clamp(150px, 29vh, 224px);
      width: min(72vw, 280px);
    }

    #splash .splash-mascot picture {
      position: absolute;
      inset: 0;
      display: block;
    }

    #splash .splash-mascot img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      -webkit-user-drag: none;
      user-select: none;
    }

    #splash .splash-message {
      max-width: 280px;
      margin: 0;
      color: #12210A;
      font-size: 13px;
      line-height: 20px;
      font-weight: 500;
      opacity: 0.7;
      text-align: center;
      text-wrap: balance;
    }

    /* ── Bawah: indikator memuat ────────────────────────────── */
    #splash .splash-bottom {
      display: flex;
      align-items: center;
    }

    #splash .splash-loader {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #splash .splash-dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: #12210A;
    }

    @keyframes splashDotPulse {

      0%,
      80%,
      100% {
        opacity: 0.25;
        transform: scale(0.9);
      }
      40% {
        opacity: 0.85;
        transform: scale(1.15);
      }
    }

    @keyframes splashChipFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-4px);
      }
    }

    @keyframes splashTwinkle {
      0%, 100% {
        opacity: 0.55;
        transform: scale(0.8);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    .splash-dot:nth-child(1) {
      animation: splashDotPulse 1.4s ease-in-out infinite 0s;
    }

    .splash-dot:nth-child(2) {
      animation: splashDotPulse 1.4s ease-in-out infinite 0.2s;
    }

    .splash-dot:nth-child(3) {
      animation: splashDotPulse 1.4s ease-in-out infinite 0.4s;
    }

    @media (prefers-reduced-motion: reduce) {
      #splash .splash-dot {
        animation: none;
        opacity: 0.6;
      }

      #splash .splash-hero::after,
      #splash .splash-chip {
        animation: none;
      }
    }

    @media (max-height: 640px) {
      #splash {
        padding-top: max(20px, env(safe-area-inset-top));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }

      #splash .splash-mascot {
        height: clamp(120px, 24vh, 160px);
      }

      #splash .splash-hero {
        gap: 8px;
        margin: 8px 0;
      }

      #splash .splash-chip {
        padding: 5px 8px;
        font-size: 10px;
      }

      #splash .splash-glyph {
        width: 42px;
        height: 42px;
      }

      #splash .splash-brand {
        transform: translateY(30px);
      }

      #splash .splash-wordmark {
        margin-top: 6px;
        font-size: 24px;
        line-height: 28px;
      }
    }
  </style>
</head>

  <!-- Penutup splash mandiri (tetap bekerja walau modul JS gagal termuat). -->
  <script>
    var splash = document.getElementById('splash');
    window.__ftSplashClose = function () {
      var s = document.getElementById('splash');
      if (!s || s.__closing) return;
      s.__closing = true;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    };
    // Jaring pengaman: bila modul JS utama gagal, splash tetap hilang sendiri
    // (dipasang lebih lama dari batas normal agar tidak menutup terlalu cepat).
    setTimeout(window.__ftSplashClose, 7000);
    // Ketuk di mana saja untuk langsung masuk.
    if (splash) splash.addEventListener('click', window.__ftSplashClose);
  </script>
